
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTechLab | Tecnologia para todos</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #090d14;
      color: #f1f5f9;
      font-family: Arial, sans-serif;
    }
    header {
      padding: 25px 8%;
      border-bottom: 1px solid #263344;
      color: #65e6a5;
      font-weight: bold;
      font-size: 22px;
    }
    main {
      max-width: 950px;
      margin: 110px auto;
      padding: 25px;
    }
    .tag { color: #65e6a5; letter-spacing: 3px; }
    h1 { font-size: clamp(42px, 8vw, 76px); }
    h1 span { color: #65e6a5; }
    p { color: #aab7c8; line-height: 1.8; font-size: 18px; }
    a {
      display: inline-block;
      margin-top: 25px;
      padding: 15px 24px;
      background: #65e6a5;
      color: #07120d;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
    }
    footer {
      padding: 30px;
      text-align: center;
      color: #778397;
      border-top: 1px solid #263344;
    }
  </style>
</head>
<body>
  <header>OpenTechLab.</header>
  <main>
    <div class="tag">OPEN KNOWLEDGE · OPEN SOURCE</div>
    <h1>Technology for <span>everyone.</span></h1>
    <p>
      A collaborative initiative to make technology more accessible
      through open knowledge, practical tools, artificial intelligence
      and innovation.
    </p>
    <a href="https://github.com/">Explore Open Source</a>
  </main>
  <footer>© 2026 OpenTechLab — Building a better technological future.</footer>
</body>
</html>
