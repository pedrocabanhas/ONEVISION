
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenTechLab | Tools</title>
  <style>
    body {
      margin: 0;
      padding: 50px 20px;
      background: #080d18;
      color: white;
      font-family: Arial, sans-serif;
      text-align: center;
    }
    h1 { font-size: 42px; }
    p { color: #aab5c8; }
    a { color: #60a5fa; }
    .tool {
      max-width: 600px;
      margin: 30px auto;
      padding: 30px;
      background: #121c2e;
      border: 1px solid #263750;
      border-radius: 15px;
    }
    
/* ==================================
   OPENTECHLAB - PREMIUM GLASS THEME
================================== */

* {
  box-sizing: border-box;
}

html {
  scroll-behavior: smooth;
}

body {
  min-height: 100vh;
  margin: 0;
  color: #f8fafc;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(ellipse at 10% 10%, rgba(37, 99, 235, .22), transparent 40%),
    radial-gradient(ellipse at 90% 25%, rgba(124, 58, 237, .20), transparent 40%),
    radial-gradient(ellipse at 50% 100%, rgba(6, 182, 212, .12), transparent 45%),
    linear-gradient(135deg, #050816, #0b1120 55%, #080b18);
  background-attachment: fixed;
}

/* Ambient lighting */

body::before,
body::after {
  content: "";
  position: fixed;
  width: 400px;
  height: 400px;
  border-radius: 50%;
  filter: blur(120px);
  pointer-events: none;
  z-index: -1;
}

body::before {
  top: 5%;
  left: -180px;
  background: rgba(37, 99, 235, .15);
}

body::after {
  right: -180px;
  bottom: 0;
  background: rgba(124, 58, 237, .15);
}

/* Glass header */

header,
nav {
  background: rgba(8, 13, 29, .65);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, .10);
}

/* Glass cards */

.card,
.feature-card,
.panel,
section {
  background: rgba(255, 255, 255, .055);
  border: 1px solid rgba(255, 255, 255, .12);
  backdrop-filter: blur(18px);
  -webkit-backdrop-filter: blur(18px);
  border-radius: 18px;
  box-shadow: 0 12px 35px rgba(0, 0, 0, .20);
  transition: .3s ease;
}

.card:hover,
.feature-card:hover,
.panel:hover {
  transform: translateY(-5px);
  border-color: rgba(96, 165, 250, .5);
  box-shadow: 0 12px 35px rgba(37, 99, 235, .16);
}

/* Typography */

h1, h2, h3, h4 {
  color: #ffffff;
  letter-spacing: -.7px;
}

p {
  color: #aab8d0;
  line-height: 1.7;
}

/* Links */

a {
  color: #93c5fd;
  text-decoration: none;
  transition: .25s ease;
}

a:hover {
  color: #c4b5fd;
}

/* Buttons */

button,
.btn {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 11px;
  padding: 12px 22px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s ease;
}

button:hover,
.btn:hover {
  transform: translateY(-3px);
  filter: brightness(1.15);
  box-shadow: 0 8px 28px rgba(124, 58, 237, .35);
}

/* Inputs */

input,
textarea,
select {
  background: rgba(5, 10, 25, .75);
  color: white;
  border: 1px solid rgba(148, 163, 184, .22);
  border-radius: 12px;
  padding: 14px;
}

/* Entrance animation */

@keyframes pageFade {
  from {
    opacity: 0;
    transform: translateY(18px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

main {
  animation: pageFade .7s ease both;
}

/* Scrollbar */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(#2563eb, #7c3aed);
  border-radius: 10px;
}

/* Accessibility */

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: .01ms !important;
    transition-duration: .01ms !important;
  }
}

  </style>
</head>
<body>
  <h1>OpenTechLab</h1>
  <p>Technology for everyone.</p>

  <div class="tool">
    <h2>AI Laboratory</h2>
    <p>Explore artificial intelligence and future technologies.</p>
    <p>Coming soon.</p>
  </div>

  <a href="../index.html">Back to Home</a>
</body>
</html>
