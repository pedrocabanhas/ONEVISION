
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Playground | OpenTechLab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #263750;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  color: #60a5fa;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

.description {
  color: #aab5c8;
}

.editors {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #93c5fd;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 230px;
  padding: 15px;
  background: #111c2e;
  color: #dbeafe;
  border: 1px solid #263750;
  border-radius: 10px;
  resize: vertical;
  font-family: monospace;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 20px;
  margin: 20px 8px 20px 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

iframe {
  width: 100%;
  height: 350px;
  background: white;
  border: none;
  border-radius: 10px;
}

@media(max-width: 750px) {
  .editors {
    grid-template-columns: 1fr;
  }
}
</style>
</head>

<body>

<header>
  <h2>OpenTechLab</h2>
  <span>CODE PLAYGROUND</span>
</header>

<main>

<h1>Code Playground</h1>
<p class="description">
  Escreva, teste e visualize seus códigos diretamente no navegador.
</p>

<div class="editors">

<div>
<label>HTML</label>
<textarea id="html"><h1>Hello World!</h1>
<p>Meu primeiro projeto no OpenTechLab.</p></textarea>
</div>

<div>
<label>CSS</label>
<textarea id="css">body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
  background: #eaf2ff;
}

h1 {
  color: #2563eb;
}</textarea>
</div>

<div>
<label>JavaScript</label>
<textarea id="js">console.log("OpenTechLab iniciado!");

alert("Bem-vindo ao Code Playground!");</textarea>
</div>

</div>

<button onclick="runCode()">▶ Executar código</button>
<button onclick="clearCode()">Limpar</button>

<h2>Visualização</h2>

<iframe id="preview" sandbox="allow-scripts"></iframe>

</main>

<script>
function runCode() {
  const html = document.getElementById("html").value;
  const css = document.getElementById("css").value;
  const js = document.getElementById("js").value;

  const output = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>${css}</style>
    </head>
    <body>
      ${html}
      <script>${js}<\/script>
    </body>
    </html>
  `;

  document.getElementById("preview").srcdoc = output;
}

function clearCode() {
  document.getElementById("html").value = "";
  document.getElementById("css").value = "";
  document.getElementById("js").value = "";
  document.getElementById("preview").srcdoc = "";
}

runCode();
</script>

</body>
</html>
