
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Code Playground | OpenTechLab</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: #080d18;
  color: #fff;
  font-family: Arial, sans-serif;
}

header {
  padding: 22px;
  border-bottom: 1px solid #263750;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

header h2 {
  margin: 0;
  color: #60a5fa;
}

main {
  max-width: 1200px;
  margin: auto;
  padding: 25px;
}

.description {
  color: #aab5c8;
}

.editors {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 12px;
  margin-top: 25px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #93c5fd;
  font-weight: bold;
}

textarea {
  width: 100%;
  height: 230px;
  padding: 15px;
  background: #111c2e;
  color: #dbeafe;
  border: 1px solid #263750;
  border-radius: 10px;
  resize: vertical;
  font-family: monospace;
  font-size: 14px;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 12px 20px;
  margin: 20px 8px 20px 0;
  border-radius: 8px;
  cursor: pointer;
  font-weight: bold;
}

button:hover {
  background: #1d4ed8;
}

iframe {
  width: 100%;
  height: 350px;
  background: white;
  border: none;
  border-radius: 10px;
}

@media(max-width: 750px) {
  .editors {
    grid-template-columns: 1fr;
  }
}
  
/* =================================
   OPENTECHLAB - CODE PLAYGROUND UI
================================= */

* {
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  margin: 0;
  color: #f8fafc;
  font-family: Inter, Arial, sans-serif;
  background:
    radial-gradient(ellipse at 10% 10%, rgba(37, 99, 235, .20), transparent 40%),
    radial-gradient(ellipse at 90% 25%, rgba(124, 58, 237, .18), transparent 40%),
    linear-gradient(135deg, #050816, #0b1120 55%, #080b18);
  background-attachment: fixed;
}

header {
  background: rgba(8, 13, 29, .75);
  backdrop-filter: blur(20px);
  border-bottom: 1px solid rgba(255, 255, 255, .10);
}

h1, h2, h3 {
  color: #fff;
  letter-spacing: -.7px;
}

p, label {
  color: #aab8d0;
}

/* Editor panels */

.editor,
.editor-container,
.panel,
.output,
.preview-container {
  background: rgba(15, 23, 42, .72);
  border: 1px solid rgba(255, 255, 255, .12);
  border-radius: 16px;
  backdrop-filter: blur(16px);
  box-shadow: 0 12px 35px rgba(0, 0, 0, .22);
  overflow: hidden;
}

/* Code areas */

textarea,
pre,
code {
  background: rgba(3, 7, 18, .85);
  color: #dbeafe;
  border: 1px solid rgba(148, 163, 184, .18);
  border-radius: 10px;
  font-family: Consolas, monospace;
  line-height: 1.6;
}

textarea {
  width: 100%;
  padding: 14px;
  resize: vertical;
}

/* Buttons */

button {
  background: linear-gradient(135deg, #2563eb, #7c3aed);
  color: white;
  border: 1px solid rgba(255, 255, 255, .16);
  border-radius: 10px;
  padding: 12px 20px;
  font-weight: 600;
  cursor: pointer;
  transition: .3s ease;
}

button:hover {
  transform: translateY(-3px);
  box-shadow: 0 8px 28px rgba(124, 58, 237, .35);
  filter: brightness(1.15);
}

/* Preview */

iframe {
  width: 100%;
  min-height: 300px;
  background: white;
  border: 1px solid rgba(255, 255, 255, .15);
  border-radius: 12px;
}

/* Links */

a {
  color: #93c5fd;
  text-decoration: none;
}

a:hover {
  color: #c4b5fd;
}

/* Scrollbar */

::-webkit-scrollbar {
  width: 8px;
}

::-webkit-scrollbar-thumb {
  background: linear-gradient(#2563eb, #7c3aed);
  border-radius: 10px;
}

</style>
</head>

<body>

<header>
  <h2>OpenTechLab</h2>
  <span>CODE PLAYGROUND</span>
</header>

<main>

<h1>Code Playground</h1>
<p class="description">
  Escreva, teste e visualize seus códigos diretamente no navegador.
</p>

<div class="editors">

<div>
<label>HTML</label>
<textarea id="html"><h1>Hello World!</h1>
<p>Meu primeiro projeto no OpenTechLab.</p></textarea>
</div>

<div>
<label>CSS</label>
<textarea id="css">body {
  font-family: Arial;
  text-align: center;
  padding: 40px;
  background: #eaf2ff;
}

h1 {
  color: #2563eb;
}</textarea>
</div>

<div>
<label>JavaScript</label>
<textarea id="js">console.log("OpenTechLab iniciado!");

alert("Bem-vindo ao Code Playground!");</textarea>
</div>

</div>

<button onclick="runCode()">▶ Executar código</button>
<button onclick="clearCode()">Limpar</button>

<h2>Visualização</h2>

<iframe id="preview" sandbox="allow-scripts"></iframe>

</main>

<script>
function runCode() {
  const html = document.getElementById("html").value;
  const css = document.getElementById("css").value;
  const js = document.getElementById("js").value;

  const output = `
    <!DOCTYPE html>
    <html>
    <head>
      <style>${css}</style>
    </head>
    <body>
      ${html}
      <script>${js}<\/script>
    </body>
    </html>
  `;

  document.getElementById("preview").srcdoc = output;
}

function clearCode() {
  document.getElementById("html").value = "";
  document.getElementById("css").value = "";
  document.getElementById("js").value = "";
  document.getElementById("preview").srcdoc = "";
}

runCode();
</script>

</body>
</html>
